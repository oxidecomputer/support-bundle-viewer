[package]
name = "support-bundle-viewer"
description = "Tools for inspecting an Oxide support bundle"
version = "0.1.2"
edition = "2021"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bytes = "1.11.1"
camino = { version = "1.2.2", features = ["serde1"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
tokio = { version = "1.52.3", features = ["io-util", "io-std", "time"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate","bzip2"] }
