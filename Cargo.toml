[package]
name = "support-bundle-viewer"
description = "Tools for inspecting an Oxide support bundle"
version = "0.1.2"
edition = "2021"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.2"
camino = { version = "1.2.6", features = ["serde1"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["io-util", "io-std", "time"] }
zip = { version = "9.8.0", default-features = false, features = ["deflate","bzip2"] }
